# Netlify config for the standalone Rentle marketing site.
# Static site — no build step, just publish the repo root.

[build]
  publish = "."

[[headers]]
  for = "/images/*"
  [headers.values]
    # Revalidate images each load (etag → cheap 304 if unchanged) so logo/asset
    # swaps show up on a normal refresh. Bump back to a long max-age once stable.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
